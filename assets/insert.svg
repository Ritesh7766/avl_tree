<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%">
  <style>
    .bg { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .title { fill: #f8fafc; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    .status { fill: #94a3b8; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .label { fill: #f8fafc; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; dominant-baseline: central; }
    .tag { fill: #fca5a5; font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .edge { stroke: #475569; stroke-width: 2.2; stroke-linecap: round; }
    .edge-new { stroke: #38bdf8; stroke-width: 2.2; stroke-dasharray: 5 4; stroke-linecap: round; }

    /* 10s 4-stage loop:
       0-22%: Incoming 25
       25-47%: Attached, RL detected at 20 (bf=-2) &amp; 40 (bf=+1)
       50-70%: right_rotate(40)
       73-94%: left_rotate(20) -&gt; balanced at 30
    */
    .e-stage1 { animation: es1 10s ease-in-out infinite; }
    .e-stage2 { animation: es2 10s ease-in-out infinite; }
    .e-stage3 { animation: es3 10s ease-in-out infinite; }
    .e-stage4 { animation: es4 10s ease-in-out infinite; }

    .n20 { animation: n20 10s ease-in-out infinite; }
    .n10 { animation: n10 10s ease-in-out infinite; }
    .n40 { animation: n40 10s ease-in-out infinite; }
    .n30 { animation: n30 10s ease-in-out infinite; }
    .n50 { animation: n50 10s ease-in-out infinite; }
    .n25 { animation: n25 10s ease-in-out infinite; }

    .c20 { animation: c20 10s ease-in-out infinite; }
    .c40 { animation: c40 10s ease-in-out infinite; }
    .c30 { animation: c30 10s ease-in-out infinite; }
    .c10 { animation: c10 10s ease-in-out infinite; }
    .c50 { animation: c50 10s ease-in-out infinite; }
    .c25 { animation: c25 10s ease-in-out infinite; }

    .bf-warn { animation: bfw 10s ease-in-out infinite; }
    .s1 { animation: s1 10s ease-in-out infinite; }
    .s2 { animation: s2 10s ease-in-out infinite; }
    .s3 { animation: s3 10s ease-in-out infinite; }
    .s4 { animation: s4 10s ease-in-out infinite; }

    @keyframes es1 { 0%, 22%, 96%, 100% { opacity: 1; } 25%, 94% { opacity: 0; } }
    @keyframes es2 { 0%, 22%, 49%, 100% { opacity: 0; } 25%, 47% { opacity: 1; } }
    @keyframes es3 { 0%, 47%, 72%, 100% { opacity: 0; } 50%, 70% { opacity: 1; } }
    @keyframes es4 { 0%, 70%, 96%, 100% { opacity: 0; } 74%, 94% { opacity: 1; } }

    @keyframes n20 { 0%, 70%, 96%, 100% { transform: translate(310px, 65px); } 74%, 94% { transform: translate(270px, 130px); } }
    @keyframes n10 { 0%, 70%, 96%, 100% { transform: translate(210px, 130px); } 74%, 94% { transform: translate(210px, 195px); } }
    @keyframes n40 { 0%, 47%, 96%, 100% { transform: translate(410px, 130px); } 50%, 70% { transform: translate(470px, 195px); } 74%, 94% { transform: translate(490px, 130px); } }
    @keyframes n30 { 0%, 47%, 96%, 100% { transform: translate(350px, 195px); } 50%, 70% { transform: translate(410px, 130px); } 74%, 94% { transform: translate(380px, 65px); } }
    @keyframes n50 { 0%, 47%, 96%, 100% { transform: translate(470px, 195px); } 50%, 70% { transform: translate(525px, 250px); } 74%, 94% { transform: translate(550px, 195px); } }
    @keyframes n25 {
      0%, 20%, 96%, 100% { transform: translate(260px, 250px); opacity: 0.75; }
      25%, 47% { transform: translate(295px, 250px); opacity: 1; }
      50%, 70% { transform: translate(350px, 195px); opacity: 1; }
      74%, 94% { transform: translate(330px, 195px); opacity: 1; }
    }

    @keyframes c20 { 0%, 22%, 96%, 100% { fill: #1e293b; stroke: #38bdf8; } 25%, 70% { fill: #7f1d1d; stroke: #ef4444; } 74%, 94% { fill: #064e3b; stroke: #10b981; } }
    @keyframes c40 { 0%, 22%, 96%, 100% { fill: #1e293b; stroke: #38bdf8; } 25%, 47% { fill: #78350f; stroke: #f59e0b; } 50%, 70% { fill: #1e293b; stroke: #38bdf8; } 74%, 94% { fill: #064e3b; stroke: #10b981; } }
    @keyframes c30 { 0%, 70%, 96%, 100% { fill: #1e293b; stroke: #38bdf8; } 74%, 94% { fill: #064e3b; stroke: #10b981; } }
    @keyframes c10 { 0%, 70%, 96%, 100% { fill: #1e293b; stroke: #38bdf8; } 74%, 94% { fill: #064e3b; stroke: #10b981; } }
    @keyframes c50 { 0%, 70%, 96%, 100% { fill: #1e293b; stroke: #38bdf8; } 74%, 94% { fill: #064e3b; stroke: #10b981; } }
    @keyframes c25 { 0%, 70%, 96%, 100% { fill: #1e3a8a; stroke: #60a5fa; } 74%, 94% { fill: #064e3b; stroke: #10b981; } }

    @keyframes bfw { 0%, 23%, 48%, 100% { opacity: 0; } 26%, 46% { opacity: 1; } }
    @keyframes s1 { 0%, 22%, 96%, 100% { opacity: 1; } 25%, 94% { opacity: 0; } }
    @keyframes s2 { 0%, 22%, 49%, 100% { opacity: 0; } 25%, 47% { opacity: 1; } }
    @keyframes s3 { 0%, 47%, 72%, 100% { opacity: 0; } 50%, 70% { opacity: 1; } }
    @keyframes s4 { 0%, 70%, 96%, 100% { opacity: 0; } 74%, 94% { opacity: 1; } }
  </style>

  <rect class="bg" x="1" y="1" width="758" height="298" />
  <text class="title" x="380" y="28">insert(root, 25) on [10, 20, 30, 40, 50]</text>

  
  <g class="e-stage1">
    <line class="edge" x1="310" y1="65" x2="210" y2="130" />
    <line class="edge" x1="310" y1="65" x2="410" y2="130" />
    <line class="edge" x1="410" y1="130" x2="350" y2="195" />
    <line class="edge" x1="410" y1="130" x2="470" y2="195" />
    <line class="edge-new" x1="350" y1="195" x2="260" y2="250" />
  </g>

  
  <g class="e-stage2">
    <line class="edge" x1="310" y1="65" x2="210" y2="130" />
    <line class="edge" x1="310" y1="65" x2="410" y2="130" />
    <line class="edge" x1="410" y1="130" x2="350" y2="195" />
    <line class="edge" x1="410" y1="130" x2="470" y2="195" />
    <line class="edge" x1="350" y1="195" x2="295" y2="250" />
  </g>

  
  <g class="e-stage3">
    <line class="edge" x1="310" y1="65" x2="210" y2="130" />
    <line class="edge" x1="310" y1="65" x2="410" y2="130" />
    <line class="edge" x1="410" y1="130" x2="350" y2="195" />
    <line class="edge" x1="410" y1="130" x2="470" y2="195" />
    <line class="edge" x1="470" y1="195" x2="525" y2="250" />
  </g>

  
  <g class="e-stage4">
    <line class="edge" x1="380" y1="65" x2="270" y2="130" />
    <line class="edge" x1="380" y1="65" x2="490" y2="130" />
    <line class="edge" x1="270" y1="130" x2="210" y2="195" />
    <line class="edge" x1="270" y1="130" x2="330" y2="195" />
    <line class="edge" x1="490" y1="130" x2="550" y2="195" />
  </g>

  
  <text class="tag bf-warn" x="255" y="55">bf = -2</text>
  <text class="tag bf-warn" x="462" y="122" style="fill: #fcd34d;">bf = +1</text>

  
  <g class="n20"><circle class="c20" r="19" stroke-width="2.2" /><text class="label">20</text></g>
  <g class="n10"><circle class="c10" r="19" stroke-width="2.2" /><text class="label">10</text></g>
  <g class="n40"><circle class="c40" r="19" stroke-width="2.2" /><text class="label">40</text></g>
  <g class="n30"><circle class="c30" r="19" stroke-width="2.2" /><text class="label">30</text></g>
  <g class="n50"><circle class="c50" r="19" stroke-width="2.2" /><text class="label">50</text></g>
  <g class="n25"><circle class="c25" r="19" stroke-width="2.2" /><text class="label">25</text></g>

  
  <text class="status s1" x="380" y="282">1. Traverse 20 -&gt; 40 -&gt; 30 and insert 25 as left child</text>
  <text class="status s2" x="380" y="282">2. Right-Left imbalance detected: bf(20) = -2, bf(40) = +1</text>
  <text class="status s3" x="380" y="282">3. Step 1: right_rotate(40) straightens right subtree</text>
  <text class="status s4" x="380" y="282">4. Step 2: left_rotate(20) promotes 30 to root (Balanced)</text>
</svg>